<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC - Atividade Prática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Calculadora de IMC</h1>
        <p class="descricao">Informe seus dados para calcular o Índice de Massa Corporal.</p>

        <form id="form-imc">
            <div class="input-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5" required>
            </div>

            <div class="input-group">
                <label for="altura">Altura (m):</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
            </div>

            <button type="button" onclick="calcularIMC()">Calcular IMC</button>
        </form>

        <div id="resultado" class="resultado escondido">
            <!-- O resultado gerado pelo JS aparecerá aqui -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
